<svg xmlns="http://www.w3.org/2000/svg" width="536" height="160" viewBox="0 0 536 160" role="img" aria-labelledby="title desc">
  <title id="title">Get sloppaTV on GitHub</title>
  <desc id="desc">A custom sloppaTV download badge linking to GitHub Releases.</desc>
