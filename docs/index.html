<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="sloppaTV project information and privacy policy.">
  <title>sloppaTV</title>
  <style>
    :root { color-scheme: dark; --bg:#0f1115; --panel:#171a21; --text:#f3f5f7; --muted:#a9b0ba; --accent:#d4ff5f; --line:#2b303a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:17px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(700px,calc(100% - 32px)); background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:clamp(28px,6vw,56px); }
    h1 { font-size:clamp(2.5rem,8vw,4.5rem); line-height:1; margin:0 0 18px; letter-spacing:-.05em; }
    p { color:var(--muted); }
    a { color:var(--accent); font-weight:700; }
  </style>
</head>
<body>
  <main>
    <h1>sloppaTV</h1>
    <p>An independent Android TV client for Jellyfin.</p>
    <p><a href="./privacy/">Privacy Policy</a> · <a href="https://github.com/brandonp2412/sloppaTV">Source code</a></p>
  </main>
</body>
</html>
