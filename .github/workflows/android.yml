name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          # Under pipefail, `yes` exits with SIGPIPE once sdkmanager has consumed
          # all license answers. Check sdkmanager's status specifically instead.
          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          test "$sdkmanager_status" -eq 0

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Configure signing identity
        shell: bash
        env:
          SLOPPATV_KEYSTORE_BASE64: ${{ secrets.SLOPPATV_KEYSTORE_BASE64 }}
          SLOPPATV_STORE_PASSWORD: ${{ secrets.SLOPPATV_STORE_PASSWORD }}
          SLOPPATV_KEY_ALIAS: ${{ secrets.SLOPPATV_KEY_ALIAS }}
          SLOPPATV_KEY_PASSWORD: ${{ secrets.SLOPPATV_KEY_PASSWORD }}
        run: |
          CI_KEYSTORE="$RUNNER_TEMP/sloppatv-ci.jks"
          if [[ -n "$SLOPPATV_KEYSTORE_BASE64" && -n "$SLOPPATV_STORE_PASSWORD" && -n "$SLOPPATV_KEY_ALIAS" && -n "$SLOPPATV_KEY_PASSWORD" ]]; then
            printf '%s' "$SLOPPATV_KEYSTORE_BASE64" | base64 --decode > "$CI_KEYSTORE"
            {
              printf 'storeFile=%s\n' "$CI_KEYSTORE"
              printf 'storePassword=%s\n' "$SLOPPATV_STORE_PASSWORD"
              printf 'keyAlias=%s\n' "$SLOPPATV_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$SLOPPATV_KEY_PASSWORD"
            } > key.properties
            printf 'SLOPPATV_SIGNING_MODE=stable\n' >> "$GITHUB_ENV"
          else
            keytool -genkeypair \
              -keystore "$CI_KEYSTORE" \
              -storetype JKS \
              -storepass sloppatv-ci \
              -keypass sloppatv-ci \
              -alias sloppatv-ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -dname "CN=sloppaTV CI, OU=CI, O=sloppaTV, L=Auckland, ST=Auckland, C=NZ" \
              -noprompt
            {
              printf 'storeFile=%s\n' "$CI_KEYSTORE"
              printf 'storePassword=%s\n' 'sloppatv-ci'
              printf 'keyAlias=%s\n' 'sloppatv-ci'
              printf 'keyPassword=%s\n' 'sloppatv-ci'
            } > key.properties
            printf 'SLOPPATV_SIGNING_MODE=ephemeral\n' >> "$GITHUB_ENV"
          fi

      - name: Run host policy tests
        run: ./tools/run_host_tests.py

      - name: Build debug, benchmark and release APKs
        run: ./gradlew --no-daemon test assembleDebug assembleBenchmark assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sloppaTV-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/benchmark/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  screenshots:
    name: Android TV screenshots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sloppaTV-apks
          path: artifacts/apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ANDROID_SERIAL=emulator-5554 SLOPPATV_APK="$(find artifacts/apks -type f -name '*-debug.apk' -print -quit)" ./tools/ci_screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sloppaTV-screenshots
          path: artifacts/ci-screenshots
          if-no-files-found: warn
          retention-days: 14
