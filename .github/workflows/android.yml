name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          # Under pipefail, `yes` exits with SIGPIPE once sdkmanager has consumed
          # all license answers. Check sdkmanager's status specifically instead.
          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          test "$sdkmanager_status" -eq 0

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Configure Play signing identity
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is required}"
          : "${ANDROID_STORE_PASSWORD:?ANDROID_STORE_PASSWORD secret is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is required}"

          CI_KEYSTORE="$RUNNER_TEMP/sloppatv-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$CI_KEYSTORE"

          keytool -list \
            -keystore "$CI_KEYSTORE" \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          keytool -certreq \
            -keystore "$CI_KEYSTORE" \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -file "$RUNNER_TEMP/sloppatv-signing-check.csr" >/dev/null

          actual_sha1="$(
            keytool -list -v \
              -keystore "$CI_KEYSTORE" \
              -storepass "$ANDROID_STORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" \
              | sed -n 's/^[[:space:]]*SHA1: //p' \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )"
          expected_sha1="63D1345BF11526974C5D73F535578E51018D9B61"
          test "$actual_sha1" = "$expected_sha1" || {
            echo "::error::Signing secret is not the Google Play upload key for sloppaTV."
            echo "::error::Expected SHA-1 63:D1:34:5B:F1:15:26:97:4C:5D:73:F5:35:57:8E:51:01:8D:9B:61."
            exit 1
          }

          {
            printf 'storeFile=%s\n' "$CI_KEYSTORE"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > key.properties

      - name: Run host policy tests
        run: ./tools/run_host_tests.py

      - name: Validate Google Play metadata
        run: python3 tools/sync_play_store_screenshots.py --validate-only

      - name: Build debug, benchmark and release artifacts
        run: ./gradlew --no-daemon test assembleDebug assembleBenchmark assembleRelease bundleRelease

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sloppaTV-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/benchmark/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  screenshots:
    name: Android TV screenshots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sloppaTV-apks
          path: artifacts/apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ANDROID_SERIAL=emulator-5554 SLOPPATV_APK="$(find artifacts/apks -type f -name '*-debug.apk' -print -quit)" ./tools/ci_screenshots.sh

      - name: Verify Play Store screenshot packaging
        run: python3 tools/sync_play_store_screenshots.py --source artifacts/ci-screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sloppaTV-screenshots
          path: artifacts/ci-screenshots
          if-no-files-found: warn
          retention-days: 14

  publish-screenshots:
    name: Attach Android TV screenshots to the release source
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the tested source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Download generated screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sloppaTV-screenshots
          path: artifacts/ci-screenshots

      - name: Update Play Store listing assets
        run: python3 tools/sync_play_store_screenshots.py --source artifacts/ci-screenshots

      - name: Commit updated screenshot assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- fastlane/metadata/android/en-US/images/tvScreenshots; then
            echo "Android TV screenshots are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastlane/metadata/android/en-US/images/tvScreenshots
          git commit -m "Update Android TV screenshots [skip ci]"
          git push origin "HEAD:main"
